<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000 !important;
      color: #999999 !important;
      font-family: "Doto", sans-serif;
      font-optical-sizing: auto;
      font-variation-settings: "ROND" 0;
      padding: 40px 20px;
      max-width: 650px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Sub-Page Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
    }

    .back-link {
      font-weight: 300;
      font-size: 0.9rem;
      color: #8b949e !important;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      color: #ffffff !important;
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 900;
      color: #ffffff;
      border: 1px dashed #21262d;
      padding: 4px 8px;
      text-transform: uppercase;
    }

    /* Typography Hierarchy */
    h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .meta-line {
      font-size: 0.9rem;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 40px;
      margin-bottom: 16px;
      border-bottom: 1px dashed #21262d;
      padding-bottom: 8px;
    }

    p {
      font-size: 1.05rem;
      font-weight: 300;
      margin-bottom: 20px;
    }

    /* Log Item Blocks */
    .log-list {
      list-style: none;
      padding: 0;
    }

    .log-item {
      margin-bottom: 24px;
      padding-left: 16px;
      border-left: 2px solid #21262d;
    }

    .log-date {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .log-text {
      font-size: 1.05rem;
      font-weight: 300;
    }

    /* Action Links */
    a {
      color: #ffffff !important;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    a:hover {
      background-color: #ffffff;
      color: #0d1117 !important;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="back-link">&larr; Return</a>
  </nav>

  <h1>Projects</h1>
  <div class="meta-line"></div>

  <p>A Bit About Me</p>

  <h2>Bio</h2>
  <p><strong>*</strong> Hi I'm Harper A 14yr old homeschooled junior from Jackson TN. I have been in the STEM and design fields for 5 years.  </p>


  <h2>Changelog</h2>
  <ul class="log-list">
    <li class="log-item">
      <div class="log-date"></div>
      <div class="log-text"></div>
    </li>
    <li class="log-item">
      <div class="log-date"> Last Updated 2026.09.28 </div>
      <div class="log-text"></div>
    </li>
  </ul>

</body>
</html>
